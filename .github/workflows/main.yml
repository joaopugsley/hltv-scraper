name: "Scrap workflow"

on:
  push:
    branches:
      - master

jobs:
  scrap:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      
      - name: "Setup Go"
        uses: actions/setup-go@v4
        with:
          go-version: "1.20"

      - name: "Install Chrome"
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      
      - name: "Install dependencies"
        run: go mod download

      - name: "Scrap"
        run: go run cmd/main.go